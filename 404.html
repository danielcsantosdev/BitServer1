<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada | BitSize</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Arquivo CSS da página 404 -->
  <link rel="stylesheet" href="404-style.css">
</head>
<body>

  <!-- Header simples com a logo -->
  <header class="header">
    <a href="index.html">
      <img src="assets/logo.png" alt="BitSize Logo" class="brand-logo-img">
    </a>
  </header>

  <!-- Container principal do Erro 404 -->
  <main class="error-container">
    
    <!-- Código de Erro e Ilustração Numérica -->
    <div class="error-code-wrapper">
      <span class="error-number">4</span>
      <div class="cookie-crumb">
        <!-- Ícone ilustrativo para compor a ideia de pedaço faltante -->
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a10 10 0 0 1 10 10 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 0-4-4 4 4 0 0 1-2-6"/>
          <path d="M7.5 10.5h.01"/>
          <path d="M10.5 15.5h.01"/>
          <path d="M6.5 15.5h.01"/>
        </svg>
      </div>
      <span class="error-number">4</span>
    </div>

    <!-- Título e Mensagem de Erro -->
    <h1 class="error-title">Ops! Parece que alguém comeu essa página.</h1>
    <p class="error-description">
      O link que você tentou acessar não existe, foi removido ou mudou de endereço. Não deixe de conferir as últimas novidades de IA e tecnologia!
    </p>

    <!-- Botões de Ação -->
    <div class="actions">
      <a href="index.html" class="btn-primary">
        &larr; Voltar para a página inicial
      </a>
    </div>

  </main>

  <!-- Rodapé discreto -->
  <footer class="footer">
    <p>© BitSize. Notícias de tecnologia, todos os dias.</p>
  </footer>

</body>
</html>
